<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Fuchr AI Consulting & Services",
  "alternateName": "Fuchr AI",
  "url": "https://fuchr.ai",
  "logo": "https://fuchr.ai/logo.png",
  "description": "Full-stack AI consulting and engineering company. We help businesses identify AI opportunities, build AI products, transform operations, and train teams to become AI-native.",
  "email": "hello@fuchr.ai",
  "foundingDate": "2025",
  "areaServed": ["India", "Worldwide"],
  "serviceType": ["AI Consulting", "AI Transformation", "AI Engineering", "AI Product Development", "AI Training", "AI Governance"],
  "sameAs": [
    "https://linkedin.com/company/fuchrai",
    "https://twitter.com/fuchrai"
  ],
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "sales",
    "email": "hello@fuchr.ai",
    "availableLanguage": ["English", "Hindi"]
  }
}
  }
  // ── CURSOR ──────────────────────────────────────────────────
  const cursor = document.getElementById('cursor');
  const ring   = document.getElementById('cursor-ring');
  let mx = 0, my = 0, rx = 0, ry = 0;
  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
  function animCursor() {
    cursor.style.left = mx + 'px'; cursor.style.top = my + 'px';
    rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
    ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
    requestAnimationFrame(animCursor);
  }
  animCursor();

  // ── SCROLL ANIMATIONS ───────────────────────────────────────
  const obs = new IntersectionObserver(entries => {
    entries.forEach((e, i) => {
      if (e.isIntersecting) {
        setTimeout(() => {
          e.target.classList.add('visible');
        }, e.target.dataset.delay || 0);
      }
    });
  }, { threshold: 0.15 });

  // Stagger cards
  document.querySelectorAll('[data-animate]').forEach((el, i) => {
    el.dataset.delay = i % 3 * 100;
    obs.observe(el);
  });

  // Stats
  document.querySelectorAll('.stat-item').forEach((el, i) => {
    el.style.transitionDelay = `${i * 0.12}s`;
    obs.observe(el);
  });

  // Process steps
  document.querySelectorAll('.process-step').forEach((el, i) => {
    el.style.transitionDelay = `${i * 0.1}s`;
    obs.observe(el);
  });

  // ── NAV SCROLL ──────────────────────────────────────────────
  const nav = document.querySelector('nav');
  window.addEventListener('scroll', () => {
    nav.style.background = window.scrollY > 40
      ? 'rgba(246,243,236,0.97)'
      : 'rgba(246,243,236,0.85)';
  });

  // ── FORM SUBMIT (Formspree) ──────────────────────────────────
  const form = document.getElementById('contactForm');
  const btn  = document.getElementById('submitBtn');
  const success = document.getElementById('formSuccess');
  if (form) {
    form.addEventListener('submit', async e => {
      e.preventDefault();
      btn.innerHTML = 'Sending...';
      btn.style.opacity = '0.7';
      btn.disabled = true;
      try {
        const res = await fetch('https://formspree.io/f/mjgjwvkb', {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
          form.querySelectorAll('input, textarea, button').forEach(el => el.style.display = 'none');
          success.style.display = 'block';
        } else {
          btn.innerHTML = 'Something went wrong. Try again.';
          btn.style.opacity = '1';
          btn.disabled = false;
        }
      } catch(err) {
        btn.innerHTML = 'Something went wrong. Try again.';
        btn.style.opacity = '1';
        btn.disabled = false;
      }
    });
  }

  // ── SERVICES CAROUSEL DOTS ──────────────────────────────────
  const carousel = document.getElementById('serviceCarousel');
  const dots = document.querySelectorAll('.carousel-dot');
  if (carousel && dots.length) {
    carousel.addEventListener('scroll', () => {
      const cards = carousel.querySelectorAll('.service-carousel-card');
      if (!cards.length) return;
      const cardWidth = cards[0].offsetWidth + 16;
      const active = Math.min(Math.round(carousel.scrollLeft / cardWidth), dots.length - 1);
      dots.forEach((d, i) => d.classList.toggle('active', i === active));
    });
  }

  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', e => {
      const target = document.querySelector(a.getAttribute('href'));
      if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth' }); }
    });
  });
    }
    document.querySelectorAll(".mobile-acc-link").forEach(function(a) {
      a.addEventListener("click", function() {
        var mm = document.getElementById("mobileMenu");
        if (mm) mm.classList.remove("open");
        document.body.style.overflow = "";
      });
    });
  });

  // Burger menu
  const burger = document.getElementById('burger');
  const mobileMenu = document.getElementById('mobileMenu');
  if (burger && mobileMenu) {
    burger.addEventListener('click', () => {
      const open = !mobileMenu.classList.contains('open');
      mobileMenu.classList.toggle('open', open);
      burger.setAttribute('aria-expanded', open);
      document.body.style.overflow = open ? 'hidden' : '';
    });
    mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      mobileMenu.classList.remove('open');
      burger.setAttribute('aria-expanded', false);
      document.body.style.overflow = '';
    }));
  }

  // Mobile accordion
  const accToggle = document.getElementById('mobileAccToggle');
  const accBody = document.getElementById('mobileAccBody');
  if (accToggle && accBody) {
    accToggle.addEventListener('click', () => {
      const open = accBody.classList.toggle('open');
      accToggle.classList.toggle('open', open);
    });
  }
  document.querySelectorAll('.mobile-acc-link').forEach(a => {
    a.addEventListener('click', () => {
      if (mobileMenu) mobileMenu.classList.remove('open');
      document.body.style.overflow = '';
    });
  });
</script>
